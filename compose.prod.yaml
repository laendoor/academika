services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pg_data_prod:/var/lib/postgresql/data

  api:
    image: leandrojdl/academika-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres

  web:
    image: leandrojdl/academika-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  dozzle:
    image: amir20/dozzle:v11
    restart: unless-stopped
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/academika/dozzle-data:/data

volumes:
  pg_data_prod:
