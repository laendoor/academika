name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: CI Gates
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academika
          POSTGRES_USER: academika
          POSTGRES_PASSWORD: academika
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend dependencies
        run: uv sync --all-packages --all-groups --frozen
      - name: Install frontend dependencies
        run: cd apps/web && npm ci
      - parallel:
          - name: Lint backend (ruff)
            run: uv run ruff check apps/api apps/cli packages && uv run ruff format --check apps/api apps/cli packages
          - name: Test backend (pytest)
            # Ambas suites corren aunque la primera falle, para que el
            # coverage.xml exista siempre y Codecov notifique (after_n_builds).
            run: |
              STATUS=0
              uv run pytest apps/api/tests/unit/ apps/cli/tests/unit/ packages/analytika --cov=app --cov=clika --cov-report=term || STATUS=1
              uv run pytest apps/api/tests/integration/ apps/cli/tests/integration/ -v --cov=app --cov=clika --cov-append --cov-report=xml --cov-report=term || STATUS=1
              exit $STATUS
          - name: Check migrations (alembic)
            run: |
              cd apps/api
              uv run alembic upgrade head
              uv run alembic check
              uv run alembic downgrade base
              uv run alembic upgrade head
            env:
              DATABASE_URL: postgresql+asyncpg://academika:academika@localhost:5432/academika
          - name: Lint frontend (biome)
            run: cd apps/web && npm run lint
          - name: Test frontend (vitest)
            run: cd apps/web && npm run test -- --coverage
          - name: Build frontend
            run: cd apps/web && npm run build
      # Siempre suben aunque los tests fallen: sin esto Codecov espera
      # after_n_builds eternamente y el status queda en pending.
      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: backend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
