services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    env_file: .env
    depends_on:
      - postgres

  web:
    build:
      context: ./apps/web
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    env_file: .env

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: academika
      POSTGRES_USER: academika
      POSTGRES_PASSWORD: academika
    volumes:
      - pg_data:/var/lib/postgresql/data

  dozzle:
    image: amir20/dozzle:v11
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    environment:
      DOZZLE_BASE: /logs

volumes:
  pg_data:
  dozzle_data:
