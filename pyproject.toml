[project]
name = "academika"
version = "0.6.0"
requires-python = ">=3.13"
dependencies = ["academika-api", "clika"]

[dependency-groups]
dev = [
    "clika",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.uv.workspace]
members = ["apps/api", "apps/cli", "packages/*"]

[tool.uv.sources]
academika-api = { workspace = true }
clika = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "S"]
ignore = ["S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Depends", "Security", "Query", "Header", "Cookie", "Body", "Form", "File"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"apps/*/tests/**" = ["S101"]
"packages/*/tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps/api/tests", "apps/cli/tests"]
