services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pg_data_prod:/var/lib/postgresql/data

  api:
    image: leandrojdl/academika-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      - postgres

  ui:
    image: leandrojdl/academika-ui:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ui
      - api

volumes:
  pg_data_prod:
