[project]
name = "clika"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "academika-db",
    "analytika",
    "asyncpg>=0.30",
    "prompt-toolkit>=3.0",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv.sources]
academika-db = { workspace = true }
analytika = { workspace = true }

[tool.setuptools.packages.find]
include = ["clika*"]
