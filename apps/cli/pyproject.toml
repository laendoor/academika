[project]
name = "clika"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "academika-db",
    "analytika",
    "asyncpg>=0.30",
    "prompt-toolkit>=3.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv.sources]
academika-db = { workspace = true }
analytika = { workspace = true }

[tool.setuptools.packages.find]
include = ["clika*"]
